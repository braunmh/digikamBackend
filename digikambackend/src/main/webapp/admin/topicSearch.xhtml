<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:comp="http://xmlns.jcp.org/jsf/composite/comp"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="./../common.xhtml">

    <ui:param name="title" value="Topics suchen"/>

    <ui:define name="navigation">
        <comp:navigation/>
    </ui:define>

    <ui:define name="content">
        <div class="ui-fluid formgrid grid">
            <div class="field col-12 md:col-6">
                <p:outputLabel for="keywords" value="Stichworte" />
                <p:autoComplete id="keywords" var="keyword" dropdown="true" 
                                multiple="false" value="#{topicSearchBean.content.keyword}"
                                completeMethod="#{topicSearchBean.completeKeyword}"
                                itemLabel="#{keyword.name}" itemValue="#{keyword}"
                                scrollHeight="250">
                    <f:converter converterId="keywordConverter"/>
                </p:autoComplete>
                <p:message id="keywordMsg" for="keywords" display="tooltip"/>
            </div>
            <div class="field col-12 md:col-6">
                <p:outputLabel for="year" value="Jahr" id="labelYear" />
                <p:inputText id="year" value="#{topicSearchBean.content.year}">
                    <p:ajax event="change" update="year yearMsg labelYear"/>
                    <f:converter converterId="yearConverter"/>
                </p:inputText>
                <p:message id="yearMsg" for="year" display="tooltip"/>
            </div>
        </div>
        <div class="command">
            <p:commandButton styleClass="di-add" id="add" 
                             value="Neu" 
                             actionListener="#{topicSearchBean.openInsertDialog}">
            </p:commandButton>
            <p:commandButton styleClass="di-button" id="execute" 
                             value="Suchen" update="@form"
                             action="#{topicSearchBean.execute()}"/>
        </div>
        <p:dataTable id="result" var="row" value="#{topicSearchBean.topics}" 
                     paginator="true" rows="10" rendered="#{not empty topicSearchBean.topics}"
                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     currentPageReportTemplate="{startRecord}-{endRecord} von {totalRecords}"
                     rowsPerPageTemplate="10,20,40">
            <p:column id="col-title" headerText="Titel" sortBy="#{row.title}" filterBy="#{row.title}" filterMatchMode="contains" field="title">
                <h:outputText value="#{row.title}"/>
            </p:column>
            <p:column id="col-year" headerText="Jahr" sortBy="#{row.year}" filterBy="#{row.year}" field="year">
                <h:outputText value="#{row.year}"/>
            </p:column>
            <p:column id="col-keyword" headerText="Stichwort" sortBy="#{row.keyword.name}" filterBy="#{row.keyword.name}" filterMatchMode="contains" field="keyword.name">
                <h:outputText value="#{row.keyword.name}"/>
            </p:column>
            <p:column id="col-action" style="width: 10rem">
                <p:commandButton id="edit" process="@this" icon="pi pi-file-edit"
                                 styleClass="ui-button-flat"
                               actionListener="#{topicSearchBean.openEditDialog}">
                    <f:attribute name="topicId" value="#{row.id}"/>
                </p:commandButton>
            </p:column>
        </p:dataTable>
    </ui:define>
</ui:composition>
