<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:di="http://org.braun.digikam"
      xmlns:comp="http://xmlns.jcp.org/jsf/composite/comp">
    <h:head>
        <title>Topic ändern</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <h:outputStylesheet name="default.css" library="css"/>
        <h:outputStylesheet name="primeflex3.css" library="css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <script type="text/javascript">
            function addStyleToAutoCompleteMultiple(widgetVar, styleClass) {
                var widget = PF(widgetVar);
                if (widget) {
                    widget.jq[0].classList.add(styleClass);
                }
            }
            function removeStyleToAutoCompleteMultiple(widgetVar, styleClass) {
                var widget = PF(widgetVar);
                if (widget) {
                    widget.jq[0].classList.remove(styleClass);
                }
            }
        </script>
    </h:head>
    <h:body>
        <f:view id="view">
            <f:metadata>
                <f:viewParam name="id" value="#{topicEditBean.id}"/>
                <f:viewParam name="update" value="#{topicEditBean.update}"/>
                <f:viewAction action="#{topicEditBean.onload()}"/>
            </f:metadata>
            <h:form id="form">
                <div class="ui-fluid formgrid grid">
                    <comp:inputElement>
                        <p:inputText id="title" value="#{topicEditBean.content.title}" required="true"/>
                        <p:outputLabel for="title" value="#{di:label('topic.title')}" />
                        <p:message id="titleMsg" for="title" display="tooltip"/>
                    </comp:inputElement>
                    <comp:inputElement>
                        <p:inputText id="year" value="#{topicEditBean.content.year}" required="true">
                            <p:ajax event="change" update="year yearMsg labelYear"/>
                            <f:converter converterId="yearConverter"/>
                        </p:inputText>
                        <p:outputLabel id="labelYear" for="year" value="#{di:label('topic.year')}" />
                        <p:message id="yearMsg" for="year" display="tooltip"/>
                    </comp:inputElement>
                    <comp:inputElement>
                        <p:autoComplete id="keyword" value="#{topicEditBean.content.keyword}" 
                                dropdown="true" multiple="false" var="keyword"
                                completeMethod="#{topicEditBean.completeKeyword}"
                                itemLabel="#{keyword.name}" itemValue="#{keyword}"
                                scrollHeight="250" required="true">
                            <f:converter converterId="keywordConverter"/>
                        </p:autoComplete>
                        <p:outputLabel for="keyword" value="#{di:label('topic.keyword')}" />
                        <p:message id="keywordMsg" for="keyword" display="tooltip"/>
                    </comp:inputElement>
                    <comp:inputElement id="editor" styleClass="field md:col-12 col-12">
                        <p:textEditor id="content" value="#{topicEditBean.content.content}" height="15rem"/>
                    </comp:inputElement>
                    <comp:inputElement styleClass="field md:col-12 col-12">
                        <p:autoComplete id="keywords" var="keyword" dropdown="true" widgetVar="keywordWidget"
                                        multiple="true" value="#{topicEditBean.content.searchParameter.keywords}"
                                        completeMethod="#{topicEditBean.completeKeyword}"
                                        itemLabel="#{keyword.name}" itemValue="#{keyword}"
                                        scrollHeight="250"
                                        onfocus="addStyleToAutoCompleteMultiple('keywordWidget', 'ui-inputwrapper-focus')"
                                        onblur="removeStyleToAutoCompleteMultiple('keywordWidget', 'ui-inputwrapper-focus')"
                                        styleClass="#{topicEditBean.content.searchParameter.keywords.isEmpty() ? '' : 'ui-inputwrapper-filled'}">
                            <f:converter converterId="keywordConverter"/>
                            <p:ajax event="itemSelect" update="keywords"/>
                            <p:ajax event="itemUnselect" update="keywords"/>
                        </p:autoComplete>
                        <p:outputLabel for="keywords" value="#{di:label('image.keywords')}" />
                        <p:message id="keywordMsg" for="keywords" display="tooltip"/>
                    </comp:inputElement>
                    <comp:inputPair>
                        <comp:inputElementLeft>
                            <p:inputText id="dateFrom" value="#{topicEditBean.content.searchParameter.date.from}" >
                                <f:converter converterId="dateWrapperConverter"/>
                                <p:ajax update="dateFromMsg @this" event="change"/>
                            </p:inputText>
                            <p:outputLabel for="dateFrom" value="#{di:label('image.date')} #{di:label('search.rangeFrom')}" />
                            <p:message id="dateFromMsg" for="dateFrom" display="tooltip"/>
                        </comp:inputElementLeft>
                        <comp:inputElementRight>
                            <p:inputText id="dateTo" value="#{topicEditBean.content.searchParameter.date.to}">
                                <f:converter converterId="dateWrapperConverter"/>
                                <p:ajax update="dateToMsg @this" event="change"/>
                            </p:inputText>
                            <p:outputLabel for="dateTo" value="#{di:label('search.rangeTo')}" />
                            <p:message id="dateToMsg" for="dateTo" display="tooltip"/>
                        </comp:inputElementRight>
                    </comp:inputPair>
                    <comp:inputPair>
                        <comp:inputElementLeft>
                            <p:selectOneMenu id="ratingFrom"
                                             value="#{topicEditBean.content.searchParameter.ratingFrom}">
                                <f:selectItems value="#{topicEditBean.ratingValues}" 
                                               var="rating" itemLabel="#{rating.name}" itemValue="#{rating}"/>
                                <f:converter converterId="ratingConverter"/>
                            </p:selectOneMenu>
                            <p:outputLabel for="@previous" value="#{di:label('image.rating')} #{di:label('search.rangeFrom')}" />
                        </comp:inputElementLeft>
                        <comp:inputElementRight>
                            <p:selectOneMenu id="ratingTo"
                                             value="#{topicEditBean.content.searchParameter.ratingTo}">
                                <f:selectItems value="#{topicEditBean.ratingValues}" 
                                               var="rating" itemLabel="#{rating.name}" itemValue="#{rating}"/>
                                <f:converter converterId="ratingConverter"/>
                            </p:selectOneMenu>
                            <p:outputLabel for="@previous" value="#{di:label('search.rangeTo')}" />
                        </comp:inputElementRight>
                    </comp:inputPair>
                </div>
                <div class="command">
                    <p:commandButton styleClass="di-button" id="generate" value="Generieren" action="#{topicEditBean.generate()}" update="@form" ajax="true" />
                    <p:commandButton styleClass="di-button" id="close" value="#{di:label('common.close')}" action="#{topicEditBean.close()}" immediate="true" />
                    <p:commandButton styleClass="di-button" id="save" value="#{di:label('common.save')}" action="#{topicEditBean.save()}"/>
                </div>
            </h:form>
        </f:view>
    </h:body>
</html>
