<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:cc="jakarta.faces.composite">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="hasAside" type="java.lang.Boolean" default="false"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <div class="main-nav">
            <div style="width: 100%">
                <p:commandButton id="mainmenu-btn" value="" type="button" icon="pi pi-bars"/>
            </div>
            <h:panelGroup id="aside-btn" layout="block" rendered="#{cc.attrs.hasAside}" styleClass="aside-btn">
                <span></span>
            </h:panelGroup>
        </div>
        <p:menu overlay="true" trigger="mainmenu-btn" my="left top" at="left bottom" toggleable="true">
            <p:submenu label="Suchen">
                <p:menuitem value="Bilder suchen" outcome="/search/search" icon="pi pi-fw pi-search" partialSubmit="true"/>
                <p:menuitem value="Übersicht" outcome="/topic/index" icon="pi pi-fw pi-search" partialSubmit="true" />
            </p:submenu>
            <p:submenu label="Statistik" expanded="false">
                <p:menuitem value="Info" icon="pi-fw pi pi-info" outcome="/statistic/statistics"/>
                <p:menuitem value="nach Monat" outcome="/statistic/year" icon="pi pi-fw pi-align-justify"/>
                <p:menuitem value="nach Stichwort" outcome="/statistic/keyword" icon="pi pi-fw pi-align-justify"/>
                <p:menuitem value="nach Kamera / Objektiv" outcome="/statistic/diagram" icon="pi pi-fw pi-align-justify"/>
            </p:submenu>
            <p:submenu label="Administration">
                <p:menuitem value="Topic Suche" icon="pi-fw pi pi-search" outcome="/admin/topicSearch"/>
                <p:menuitem value="Refresh Caches" icon="pi-fw pi pi-database" action="#{adminBean.refreshCaches}"/>
                <p:menuitem value="Suchindex aktualisieren" outcome="/admin/generate" icon="pi-fw pi pi-database"/>
                <p:menuitem value="Labels verwalten" outcome="/admin/labels" icon="pi-fw pi pi-database"/>
                <p:menuitem value="Übersichten aktualisieren" icon="pi-fw pi pi-database" action="#{topicOverviewBean.refresh()}"/>
            </p:submenu>
        </p:menu>
    </cc:implementation>
</ui:composition>
